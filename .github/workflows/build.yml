name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: flutter create --project-name baran_link . --platforms=android

      # افزودن خودکار دسترسی اینترنت به مانیفست اندروید
      - name: Add Internet Permission
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Clean and Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icons (Graceful fail)
        run: dart run flutter_launcher_icons || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaranLink-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
